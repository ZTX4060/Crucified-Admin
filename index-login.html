<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Crucified Clan</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-light: #f4f5f7;
            --text-dark: #111111;
            --text-muted: #6c757d;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
            --error-red: #ef4444;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

        body {
            background-color: var(--bg-light);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .login-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 2.5rem;
            max-width: 420px;
            width: 100%;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 25px rgba(0,0,0,0.03);
            text-align: center;
        }

        .brand-name {
            font-size: 2rem;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 0.3rem;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 2rem;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 1.2rem;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.4rem;
            font-size: 0.85rem;
        }

        .form-group input {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
            background-color: var(--bg-light);
        }

        .form-group input:focus {
            border-color: var(--text-dark);
            background-color: #fff;
        }

        .btn-submit {
            width: 100%;
            padding: 0.9rem;
            background-color: var(--text-dark);
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.3s ease;
            margin-top: 0.5rem;
        }

        .btn-submit:hover {
            background-color: var(--text-muted);
        }

        .error-msg {
            color: var(--error-red);
            font-size: 0.85rem;
            font-weight: 600;
            margin-top: 1rem;
            display: none;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="brand-name">CRUCIFIED</div>
        <p class="subtitle"><i class="fa-solid fa-lock"></i> Admin Portal Login</p>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" placeholder="Enter username" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter password" required>
            </div>
            <button type="submit" class="btn-submit">Sign In <i class="fa-solid fa-arrow-right-to-bracket"></i></button>
            <p id="errorMsg" class="error-msg">Invalid Username or Password!</p>
        </form>
    </div>

    <!-- Firebase SDK Integration -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // 1. ضع مفاتيح Firebase الخاصة بك هنا
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "crucified-ffaba.firebaseapp.com",
        projectId: "crucified-ffaba",
        storageBucket: "crucified-ffaba.appspot.com",
        messagingSenderId: "YOUR_MESSAGING_ID",
        appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // 2. دالة جلب البيانات وعرضها
    window.loadData = async function(collectionName, containerId) {
        const container = document.getElementById(containerId);
        container.innerHTML = `<div class="empty-state"><i class="fa-solid fa-spinner fa-spin"></i> Loading...</div>`;

        try {
            const querySnapshot = await getDocs(collection(db, collectionName));
            
            if (querySnapshot.empty) {
                container.innerHTML = `<div class="empty-state">No entries submitted yet.</div>`;
                return;
            }

            container.innerHTML = "";
            querySnapshot.forEach((docSnapshot) => {
                const data = docSnapshot.data();
                const card = document.createElement('div');
                card.className = 'data-card';

                // بناء كارت البيانات بناءً على نوع المجموعة
                let detailsHTML = '';
                if (collectionName === 'staff_applications') {
                    detailsHTML = `<strong>IGN:</strong> ${data.ign || 'N/A'} | <strong>Age:</strong> ${data.age || 'N/A'} | <strong>Discord:</strong> ${data.discord || 'N/A'}<br><small><strong>Experience:</strong> ${data.experience || 'N/A'}</small>`;
                } else if (collectionName === 'allies') {
                    detailsHTML = `<strong>Leader IGN:</strong> ${data.leaderIgn || 'N/A'} | <strong>Clan Name:</strong> ${data.clanName || 'N/A'}`;
                } else if (collectionName === 'reports') {
                    detailsHTML = `<strong>Reported Player:</strong> ${data.reportedPlayer || 'N/A'} | <strong>Reason:</strong> ${data.reason || 'N/A'}<br><small><strong>Proof:</strong> ${data.proof || 'N/A'}</small>`;
                }

                card.innerHTML = `
                    <div style="text-align: left;">
                        ${detailsHTML}
                    </div>
                    <button class="btn-delete" onclick="deleteEntry('${collectionName}', '${docSnapshot.id}', '${containerId}')">
                        <i class="fa-solid fa-trash"></i> Delete
                    </button>
                `;
                container.appendChild(card);
            });
        } catch (e) {
            console.error("Firebase Error:", e);
            container.innerHTML = `<div class="empty-state" style="color: red;">Error fetching data. Check Firebase Rules or Console!</div>`;
        }
    }

    // 3. دالة حذف العنصر من Firebase
    window.deleteEntry = async function(collectionName, docId, containerId) {
        if (confirm("Are you sure you want to delete this item?")) {
            try {
                await deleteDoc(doc(db, collectionName, docId));
                window.loadData(collectionName, containerId); // إعادة تحميل البيانات بعد الحذف
            } catch (error) {
                alert("Error deleting: " + error.message);
            }
        }
    }

    // 4. دالة التنقل بين التبويبات مع تشغيل التحميل تلقائياً
    window.switchTab = function(tabName, collectionName, containerId) {
        document.querySelectorAll('.content-section').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        
        document.getElementById('tab-' + tabName).classList.add('active');
        event.currentTarget.classList.add('active');

        // جلب البيانات فور التحويل
        window.loadData(collectionName, containerId);
    }

    // 5. جلب الطلبات فور فتح الصفحة تلقائياً (Staff Applications)
    document.addEventListener("DOMContentLoaded", () => {
        window.loadData('staff_applications', 'staff-list');
    });
</script>
</body>
</html>
